<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Inter','Helvetica Neue',system-ui,sans-serif">
  <rect width="640" height="440" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">Recall@10 after migration</text>
  <text x="40" y="70" font-size="13" fill="#64748b">BEIR SciFact · MiniLM (384d) → bge-large (1024d) · Ridge, K=4000</text>

  <!-- Chart area: left=120, right=560, top=100, bottom=340 -->
  <!-- Y-axis -->
  <line x1="120" y1="100" x2="120" y2="340" stroke="#1e293b" stroke-width="1"/>

  <!-- Gridlines + labels -->
  <line x1="120" y1="340" x2="560" y2="340" stroke="#1e293b" stroke-width="1"/>
  <text x="108" y="344" text-anchor="end" font-size="12" fill="#475569">0.0</text>

  <line x1="120" y1="280" x2="560" y2="280" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="108" y="284" text-anchor="end" font-size="12" fill="#475569">0.25</text>

  <line x1="120" y1="220" x2="560" y2="220" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="108" y="224" text-anchor="end" font-size="12" fill="#475569">0.50</text>

  <line x1="120" y1="160" x2="560" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="108" y="164" text-anchor="end" font-size="12" fill="#475569">0.75</text>

  <line x1="120" y1="100" x2="560" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="108" y="104" text-anchor="end" font-size="12" fill="#475569">1.00</text>

  <!-- Bar 1: No migration = 0.0 -->
  <!-- Just a thin line on the baseline -->
  <rect x="165" y="336" width="100" height="6" rx="3" fill="#334155"/>
  <text x="215" y="370" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">No migration</text>
  <text x="215" y="388" text-anchor="middle" font-size="11" fill="#475569">dimensions incompatible</text>
  <!-- Value -->
  <text x="215" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">0.00</text>

  <!-- Bar 2: Isotrieve = 0.921 -->
  <!-- height = (0.921 / 1.0) * 240 = 221, y = 340 - 221 = 119 -->
  <rect x="315" y="119" width="100" height="221" rx="6" fill="#3b82f6"/>
  <!-- Subtle inner highlight -->
  <rect x="315" y="119" width="100" height="221" rx="6" fill="url(#shimmer)" opacity="0.15"/>
  <text x="365" y="370" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Isotrieve</text>
  <text x="365" y="388" text-anchor="middle" font-size="11" fill="#475569">Ridge, K=4000</text>
  <!-- Value -->
  <text x="365" y="110" text-anchor="middle" font-size="22" font-weight="800" fill="#60a5fa">0.921</text>

  <!-- Bar 3: Full re-embed = 1.00 -->
  <rect x="465" y="100" width="100" height="240" rx="6" fill="#10b981"/>
  <rect x="465" y="100" width="100" height="240" rx="6" fill="url(#shimmer)" opacity="0.1"/>
  <text x="515" y="370" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Full re-embed</text>
  <text x="515" y="388" text-anchor="middle" font-size="11" fill="#475569">ceiling</text>
  <!-- Value -->
  <text x="515" y="92" text-anchor="middle" font-size="22" font-weight="800" fill="#34d399">1.00</text>

  <!-- Retention bracket -->
  <line x1="365" y1="114" x2="515" y2="114" stroke="#475569" stroke-width="1"/>
  <line x1="365" y1="110" x2="365" y2="118" stroke="#475569" stroke-width="1"/>
  <line x1="515" y1="110" x2="515" y2="118" stroke="#475569" stroke-width="1"/>
  <rect x="408" y="118" width="114" height="20" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="465" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">92.1% retained</text>

  <!-- Source footnote -->
  <text x="40" y="424" font-size="10" fill="#334155">benchmarks/results/ · CLAIMS.md #1 · 3 seeds, mean ± 0.004</text>

  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>