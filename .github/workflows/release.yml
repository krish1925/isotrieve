name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        working-directory: isotrieve-python
        run: pip install -e ".[dev]"
      - name: Run release tests
        working-directory: isotrieve-python
        run: python -m pytest tests/test_release.py -v --tb=short
      - name: Run full test suite
        working-directory: isotrieve-python
        run: python -m pytest tests/ -q --tb=short

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        working-directory: isotrieve-python
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: isotrieve-python/dist/

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="[${VERSION}]" 'index($0, "## " ver) == 1 {found=1; next} found && /^## \[/ {exit} found {print}' \
            isotrieve-python/CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section '## [$VERSION]' found in isotrieve-python/CHANGELOG.md" >&2
            exit 1
          fi
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "isotrieve ${GITHUB_REF_NAME#v}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "isotrieve ${GITHUB_REF_NAME#v}" \
              --notes-file /tmp/release-notes.md
          fi
