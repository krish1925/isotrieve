name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ruff
      - name: Ruff check
        run: ruff check isotrieve-python/src/ isotrieve-python/tests/
      - name: Ruff format check
        run: ruff format --check isotrieve-python/src/ isotrieve-python/tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: isotrieve-python/pyproject.toml
      - name: Install package with types
        working-directory: isotrieve-python
        run: pip install -e ".[dev]"
      - name: Mypy
        working-directory: isotrieve-python
        run: mypy src/isotrieve/ --ignore-missing-imports --no-error-summary

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: isotrieve-python/pyproject.toml
      - name: Install package
        working-directory: isotrieve-python
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: isotrieve-python
        run: python -m pytest tests/ -q --tb=short --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: isotrieve-python/test-results.xml

      - name: Adapter parity matrix is fresh
        run: python isotrieve-python/scripts/gen_adapter_matrix.py --check
        continue-on-error: true

  claims-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate CLAIMS.md
        run: python isotrieve-python/scripts/lint_claims.py
        continue-on-error: true
